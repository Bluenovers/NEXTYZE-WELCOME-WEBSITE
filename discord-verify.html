<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextyze Discord Verification</title>
    <link rel="icon" href="public/images/icon.png">
    <style>
        @font-face {
            font-family: 'TAN BUSTER';
            src: url('public/fonts/TAN-BUSTER.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: url('public/images/background.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'TAN BUSTER', Arial, sans-serif;
        }
        .verify-container {
            background: rgba(20, 20, 30, 0.85);
            border-radius: 32px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 48px 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: #fff;
            border: 1.5px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            transition: box-shadow 0.3s;
        }
        .verify-container h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            letter-spacing: 2px;
            font-family: 'TAN BUSTER', Arial, sans-serif;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
        }
        .verify-container p, .verify-container .normal-bold {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #e0e0e0;
        }
        .discord-logo {
            width: 64px;
            margin-bottom: 24px;
            transition: transform 0.3s;
        }
        .discord-logo:hover {
            transform: scale(1.1) rotate(-8deg);
        }
        .verify-btn {
            margin-top: 18px;
            padding: 12px 32px;
            background: linear-gradient(90deg, #5865F2 0%, #7289DA 100%);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px 0 rgba(88,101,242,0.18);
            transition: background 0.2s, transform 0.2s;
        }
        .verify-btn:hover {
            background: linear-gradient(90deg, #7289DA 0%, #5865F2 100%);
            transform: translateY(-2px) scale(1.04);
        }
        @media (max-width: 600px) {
            .verify-container {
                padding: 32px 8px;
                max-width: 95vw;
            }
            .verify-container h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="verify-container">
    <img src="https://cdn.jsdelivr.net/gh/edent/SuperTinyIcons/images/svg/discord.svg" alt="Discord Logo" class="discord-logo" id="discordLogo">
    <h1 id="mainThankYou">Thank You for Verifying!</h1>
    <div class="normal-bold">Your Discord verification was successful.<br>Welcome to the Nextyze community!</div>
    <div class="normal-bold" style="font-size:0.95rem;color:#b0b0b0;">You may now return to Discord and enjoy all the features.</div>
    <button class="verify-btn" id="returnBtn">Return to Discord</button>
    </div>
    <script>
        // Button interactivity: try to open Discord app to the server, fallback to invite link
        document.getElementById('returnBtn').addEventListener('click', function() {
            // Discord app deep link to server (guild_id: 1361542323963559946)
            var appUrl = 'discord://discord.com/channels/1361542323963559946';
            var inviteUrl = 'https://discord.gg/gAX38ztR';
            // Try to open the Discord app
            var timeout = setTimeout(function() {
                window.open(inviteUrl, '_blank');
            }, 800);
            window.location.href = appUrl;
        });

        // Animate Discord logo on page load
        window.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('discordLogo');
            logo.style.transform = 'scale(0.7) rotate(-20deg)';
            setTimeout(() => {
                logo.style.transition = 'transform 0.7s cubic-bezier(.25,1.7,.35,.8)';
                logo.style.transform = 'scale(1) rotate(0deg)';
            }, 200);
        });
    </script>
</body>
</html>
