<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextyze</title>
    <link rel="icon" type="image/png" href="./public/images/icon.png">
    <style>
        @font-face {
            font-family: 'TAN-BUSTER';
            src: url('./public/fonts/TAN-BUSTER.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url('./public/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            font-size: clamp(24px, 6vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: #5eb6e5;
            position: absolute;
            top: 20px;
            left: 20px;
            margin: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        h2 {
            font-size: clamp(24px, 6vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: transparent;
            -webkit-text-stroke: 2px white;
            position: absolute;
            top: clamp(60px, 12vw, 80px);
            left: 20px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .bottom-icon {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: clamp(40px, 6vw, 80px);
            height: clamp(40px, 6vw, 80px);
            opacity: 0.8;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .bottom-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .coming-soon {
            font-size: clamp(32px, 8vw, 120px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: white;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin: 0;
            text-shadow: 0 6px 12px rgba(0, 0, 0, 0.4), 0 12px 24px rgba(0, 0, 0, 0.3);
            padding: 0 20px;
            max-width: 90vw;
            z-index: 3;
            line-height: 1.2;
            white-space: nowrap;
        }

        /* Payment Button */
        .payments-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(28, 75, 171, 0.9), rgba(30, 34, 42, 0.95));
            color: white;
            border: 2px solid rgba(94, 182, 229, 0.6);
            padding: 14px 28px;
            border-radius: 30px;
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            z-index: 10;
            box-shadow: 
                0 6px 16px rgba(0, 0, 0, 0.3),
                0 3px 6px rgba(0, 0, 0, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            min-width: 130px;
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .payments-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .payments-button:hover::before {
            left: 100%;
        }

        .payments-button:hover {
            background: linear-gradient(135deg, rgba(50, 54, 62, 0.95), rgba(40, 44, 52, 1));
            border-color: rgba(94, 182, 229, 0.9);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.4),
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                0 0 12px rgba(94, 182, 229, 0.3);
        }

        .payments-button:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 
                0 4px 10px rgba(0, 0, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Tablet and Mobile Adjustments */
        @media screen and (max-width: 768px) {
            h1, h2 {
                left: 15px;
            }
            
            h1 {
                top: 15px;
            }
            
            h2 {
                top: clamp(50px, 10vw, 70px);
                -webkit-text-stroke: 2px white;
            }
            
            .coming-soon {
                white-space: normal;
            }
            
            .bottom-icon {
                bottom: 15px;
                right: 15px;
            }

            .payments-button {
                top: 15px;
                right: 15px;
                padding: 12px 22px;
                font-size: 14px;
                min-width: 110px;
                border-radius: 25px;
            }
        }

        /* Mobile Adjustments */
        @media screen and (max-width: 480px) {
            h1, h2 {
                left: 10px;
            }
            
            h1 {
                top: 10px;
            }
            
            h2 {
                top: clamp(40px, 8vw, 55px);
            }
            
            .coming-soon {
                padding: 0 15px;
            }
            
            .bottom-icon {
                bottom: 10px;
                right: 10px;
            }

            .payments-button {
                top: 10px;
                right: 10px;
                padding: 10px 18px;
                font-size: 13px;
                min-width: 95px;
                border-radius: 22px;
            }
        }

        /* Small Mobile Adjustments */
        @media screen and (max-width: 360px) {
            h2 {
                top: clamp(35px, 7vw, 50px);
                -webkit-text-stroke: 1.5px white;
            }
            
            .coming-soon {
                padding: 0 10px;
                word-break: break-word;
            }
        }

        /* Landscape orientation fixes */
        @media screen and (max-width: 767px) and (orientation: landscape) and (max-height: 500px) {
            h1 {
                font-size: clamp(18px, 4vw, 32px);
                top: 5px;
            }
            
            h2 {
                font-size: clamp(18px, 4vw, 32px);
                top: clamp(25px, 6vw, 40px);
            }
            
            .coming-soon {
                font-size: clamp(24px, 6vw, 60px);
                top: 45%;
            }
            
            .bottom-icon {
                width: clamp(30px, 5vw, 50px);
                height: clamp(30px, 5vw, 50px);
                bottom: 5px;
                right: 5px;
            }

            .payments-button {
                top: 5px;
                right: 5px;
                padding: 8px 14px;
                font-size: 12px;
                min-width: 80px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Payment Button -->
    <a href="payments.html" class="payments-button">DONATIONS</a>
    
    <h1>NEXTYZE</h1>
    <h2>NEXTYZE</h2>
    <h3 class="coming-soon">COMING SOON...</h3>
    <img src="./public/images/icon.png" alt="Nextyze Icon" class="bottom-icon">
</body>
</html>
