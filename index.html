<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextyze</title>
    <link rel="icon" type="image/png" href="./public/images/icon.png">
    <style>
        @font-face {
            font-family: 'TAN-BUSTER';
            src: url('./public/fonts/TAN-BUSTER.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url('./public/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            font-size: clamp(32px, 8vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: #5eb6e5;
            position: absolute;
            top: clamp(10px, 3vh, 20px);
            left: clamp(10px, 3vw, 20px);
            margin: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        h2 {
            font-size: clamp(32px, 8vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: transparent;
            -webkit-text-stroke: clamp(2px, 0.5vw, 3px) white;
            position: absolute;
            top: clamp(50px, 10vh, 80px);
            left: clamp(10px, 3vw, 20px);
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .bottom-icon {
            position: absolute;
            bottom: clamp(10px, 3vh, 20px);
            right: clamp(10px, 3vw, 20px);
            width: clamp(40px, 8vw, 80px);
            height: clamp(40px, 8vw, 80px);
            opacity: 0.8;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .bottom-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .coming-soon {
            font-size: clamp(28px, 12vw, 120px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: white;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin: 0;
            text-shadow: 0 6px 12px rgba(0, 0, 0, 0.4), 0 12px 24px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            padding: 0 clamp(10px, 5vw, 20px);
            max-width: 90vw;
            z-index: 3;
        }

        /* Large Desktop (1200px and above) */
        @media screen and (min-width: 1200px) {
            .coming-soon {
                font-size: 140px;
            }
            
            h1, h2 {
                font-size: 64px;
            }
            
            .bottom-icon {
                width: 100px;
                height: 100px;
            }
        }

        /* Standard Desktop (992px to 1199px) */
        @media screen and (min-width: 992px) and (max-width: 1199px) {
            .coming-soon {
                font-size: 120px;
            }
        }

        /* Tablet Landscape (768px to 991px) */
        @media screen and (min-width: 768px) and (max-width: 991px) {
            body {
                background-attachment: scroll;
            }
            
            .coming-soon {
                font-size: clamp(60px, 10vw, 90px);
                white-space: normal;
                line-height: 1.1;
            }
            
            h1, h2 {
                font-size: clamp(36px, 6vw, 48px);
            }
        }

        /* Tablet Portrait (576px to 767px) */
        @media screen and (min-width: 576px) and (max-width: 767px) {
            body {
                background-attachment: scroll;
            }
            
            .coming-soon {
                font-size: clamp(48px, 8vw, 70px);
                white-space: normal;
                line-height: 1.2;
                padding: 0 clamp(15px, 5vw, 30px);
            }
            
            h1, h2 {
                font-size: clamp(28px, 5vw, 40px);
            }
            
            h2 {
                top: clamp(45px, 8vh, 70px);
            }
        }

        /* Mobile Large (480px to 575px) */
        @media screen and (min-width: 480px) and (max-width: 575px) {
            body {
                background-attachment: scroll;
                background-position: center top;
            }
            
            .coming-soon {
                font-size: clamp(32px, 7vw, 50px);
                white-space: normal;
                line-height: 1.2;
                padding: 0 clamp(15px, 5vw, 25px);
            }
            
            h1, h2 {
                font-size: clamp(24px, 5vw, 32px);
            }
            
            h2 {
                top: clamp(40px, 7vh, 55px);
                -webkit-text-stroke: 2px white;
            }
        }

        /* Mobile Medium (360px to 479px) */
        @media screen and (min-width: 360px) and (max-width: 479px) {
            body {
                background-attachment: scroll;
                background-position: center top;
            }
            
            .coming-soon {
                font-size: clamp(26px, 6vw, 40px);
                white-space: normal;
                line-height: 1.3;
                padding: 0 clamp(10px, 4vw, 20px);
            }
            
            h1, h2 {
                font-size: clamp(20px, 4.5vw, 28px);
            }
            
            h2 {
                top: clamp(35px, 6vh, 50px);
                -webkit-text-stroke: 2px white;
            }
        }

        /* Mobile Small (320px to 359px) */
        @media screen and (max-width: 359px) {
            body {
                background-attachment: scroll;
                background-position: center top;
            }
            
            .coming-soon {
                font-size: clamp(22px, 5.5vw, 32px);
                white-space: normal;
                line-height: 1.3;
                padding: 0 clamp(8px, 3vw, 15px);
                word-break: break-word;
            }
            
            h1, h2 {
                font-size: clamp(18px, 4vw, 24px);
            }
            
            h2 {
                top: clamp(30px, 5vh, 45px);
                -webkit-text-stroke: 1.5px white;
            }
        }

        /* Ultra-wide screens */
        @media screen and (min-width: 1600px) {
            .coming-soon {
                font-size: 160px;
            }
            
            h1, h2 {
                font-size: 72px;
            }
        }

        /* High DPI screens */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            body {
                -webkit-font-smoothing: subpixel-antialiased;
            }
        }

        /* Landscape orientation on mobile */
        @media screen and (max-width: 767px) and (orientation: landscape) {
            .coming-soon {
                font-size: clamp(20px, 5vw, 35px);
                top: 45%;
            }
            
            h1 {
                font-size: clamp(16px, 3.5vw, 24px);
                top: clamp(5px, 2vh, 10px);
            }
            
            h2 {
                font-size: clamp(16px, 3.5vw, 24px);
                top: clamp(25px, 5vh, 35px);
            }
            
            .bottom-icon {
                width: clamp(30px, 5vw, 50px);
                height: clamp(30px, 5vw, 50px);
            }
        }

        /* Accessibility - Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .bottom-icon {
                transition: none;
            }
            
            .bottom-icon:hover {
                transform: none;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
            }
        }
    </style>
</head>
<body>
    <h1>NEXTYZE</h1>
    <h2>NEXTYZE</h2>
    <h3 class="coming-soon">COMING SOON...</h3>
    <img src="./public/images/icon.png" alt="Nextyze Icon" class="bottom-icon">
</body>
</html>
