<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextyze</title>
    <link rel="icon" type="image/png" href="./public/images/icon.png">
    <style>
        @font-face {
            font-family: 'TAN-BUSTER';
            src: url('./public/fonts/TAN-BUSTER.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url('./public/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            font-size: clamp(24px, 6vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: #5eb6e5;
            position: absolute;
            top: 20px;
            left: 20px;
            margin: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        h2 {
            font-size: clamp(24px, 6vw, 54px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: transparent;
            -webkit-text-stroke: 2px white;
            position: absolute;
            top: clamp(60px, 12vw, 80px);
            left: 20px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        .bottom-icon {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: clamp(40px, 6vw, 80px);
            height: clamp(40px, 6vw, 80px);
            opacity: 0.8;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .bottom-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .coming-soon {
            font-size: clamp(28px, 7vw, 100px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: white;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin: 0;
            text-shadow: 0 6px 12px rgba(0, 0, 0, 0.4), 0 12px 24px rgba(0, 0, 0, 0.3);
            padding: 0 20px;
            max-width: 95vw;
            z-index: 3;
            line-height: 1.1;
            white-space: normal;
            word-break: break-word;
        }

        /* Tablet and Mobile Adjustments */
        @media screen and (max-width: 768px) {
            h1, h2 {
                left: 15px;
            }
            
            h1 {
                top: 15px;
            }
            
            h2 {
                top: clamp(50px, 10vw, 70px);
                -webkit-text-stroke: 2px white;
            }
            
            .coming-soon {
                white-space: normal;
            }
            
            .bottom-icon {
                bottom: 15px;
                right: 15px;
            }
        }

        /* Mobile Adjustments */
        @media screen and (max-width: 480px) {
            h1, h2 {
                left: 10px;
            }
            
            h1 {
                top: 10px;
            }
            
            h2 {
                top: clamp(40px, 8vw, 55px);
            }
            
            .coming-soon {
                padding: 0 15px;
            }
            
            .bottom-icon {
                bottom: 10px;
                right: 10px;
            }
        }

        /* Small Mobile Adjustments */
        @media screen and (max-width: 360px) {
            h2 {
                top: clamp(35px, 7vw, 50px);
                -webkit-text-stroke: 1.5px white;
            }
            
            .coming-soon {
                padding: 0 10px;
                word-break: break-word;
            }
        }

        /* Landscape orientation fixes */
        @media screen and (max-width: 767px) and (orientation: landscape) and (max-height: 500px) {
            h1 {
                font-size: clamp(18px, 4vw, 32px);
                top: 5px;
            }
            
            h2 {
                font-size: clamp(18px, 4vw, 32px);
                top: clamp(25px, 6vw, 40px);
            }
            
            .coming-soon {
                font-size: clamp(20px, 5vw, 50px);
                top: 45%;
                line-height: 1.0;
                padding: 0 10px;
            }
            
            .bottom-icon {
                width: clamp(30px, 5vw, 50px);
                height: clamp(30px, 5vw, 50px);
                bottom: 5px;
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <h1>NEXTYZE</h1>
    <h2>NEXTYZE</h2>
    <h3 class="coming-soon">COMING SOON...</h3>
    <img src="./public/images/icon.png" alt="Nextyze Icon" class="bottom-icon">
</body>
</html>
