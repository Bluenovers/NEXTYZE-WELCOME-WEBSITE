<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nextyze</title>
    <link rel="icon" type="image/png" href="./public/images/icon.png">
    <style>
        @font-face {
            font-family: 'TAN-BUSTER';
            src: url('./public/fonts/TAN-BUSTER.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('./public/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(40, 44, 52, 0.9), rgba(30, 34, 42, 0.95));
            color: white;
            border: 2px solid rgba(94, 182, 229, 0.6);
            padding: 14px 24px;
            border-radius: 30px;
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            z-index: 10;
            box-shadow: 
                0 6px 16px rgba(0, 0, 0, 0.3),
                0 3px 6px rgba(0, 0, 0, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .back-button:hover {
            background: linear-gradient(135deg, rgba(50, 54, 62, 0.95), rgba(40, 44, 52, 1));
            border-color: rgba(94, 182, 229, 0.9);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.4),
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                0 0 12px rgba(94, 182, 229, 0.3);
        }

        .back-button:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 
                0 4px 10px rgba(0, 0, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* NEXTYZE Branding */
        .nextyze-brand {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 5;
        }

        .nextyze-brand h1 {
            font-size: clamp(20px, 4vw, 36px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: #5eb6e5;
            margin: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Content Container */
        .content-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: clamp(30px, 5vw, 60px);
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content-title {
            font-size: clamp(28px, 6vw, 48px);
            font-family: 'TAN-BUSTER', Arial, sans-serif;
            color: white;
            margin: 0 0 20px 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .content-description {
            font-size: clamp(16px, 3vw, 20px);
            color: white;
            margin: 0;
            line-height: 1.6;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .back-button {
                top: 15px;
                left: 15px;
                padding: 12px 20px;
                font-size: 14px;
                border-radius: 25px;
            }

            .nextyze-brand {
                top: 15px;
                right: 15px;
            }

            .content-container {
                padding: clamp(20px, 4vw, 40px);
                margin: 20px 0;
            }

            body {
                padding: 15px;
            }
        }

        @media screen and (max-width: 480px) {
            .back-button {
                top: 10px;
                left: 10px;
                padding: 10px 16px;
                font-size: 13px;
                border-radius: 22px;
            }

            .nextyze-brand {
                top: 10px;
                right: 10px;
            }

            .content-container {
                padding: clamp(15px, 3vw, 30px);
                margin: 15px 0;
            }

            body {
                padding: 10px;
            }
        }

        /* Landscape orientation fixes */
        @media screen and (max-width: 767px) and (orientation: landscape) and (max-height: 500px) {
            .back-button {
                top: 5px;
                left: 5px;
                padding: 8px 14px;
                font-size: 12px;
                border-radius: 18px;
            }

            .nextyze-brand {
                top: 5px;
                right: 5px;
            }

            .content-container {
                padding: 15px;
                margin: 10px 0;
                max-width: 400px;
            }

            body {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="index.html" class="back-button">← Back to Home</a>
    
    <!-- NEXTYZE Branding -->
    <div class="nextyze-brand">
        <h1>NEXTYZE</h1>
    </div>

    <!-- Content Container -->
    <div class="content-container">
        <h1 class="content-title">NEXTYZE</h1>
        <p class="content-description">
            Thank you for your interest in supporting NEXTYZE. 
            SHAJAHAN HANEEFA
        </p>
    </div>
</body>
</html>
